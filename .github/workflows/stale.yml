name: Stale issues and PRs

on:
  schedule:
    - cron: '0 7 * * *'  # Daily at 07:00 UTC
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    name: Mark and close stale items
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@v9
        with:
          # Issues
          days-before-issue-stale: 60
          days-before-issue-close: 14
          stale-issue-label: 'stale'
          stale-issue-message: >
            This issue has been automatically marked as stale because it has not had
            any activity in 60 days. It will be closed in 14 days unless it is
            commented on or labelled. Thank you for your contributions!
          close-issue-message: >
            This issue was closed automatically after 14 days of inactivity.
            Feel free to re-open if the problem persists.

          # PRs
          days-before-pr-stale: 30
          days-before-pr-close: 14
          stale-pr-label: 'stale'
          stale-pr-message: >
            This pull request has been automatically marked as stale because it has
            not had any activity in 30 days. It will be closed in 14 days unless it
            is updated. Please rebase and ping a maintainer if you'd like it reviewed.
          close-pr-message: >
            This PR was closed automatically after 14 days of inactivity.
            Feel free to re-open and rebase if you'd like to continue the work.

          # Never stale these
          exempt-issue-labels: 'pinned,security,upstream-sync'
          exempt-pr-labels: 'pinned,security'
          exempt-all-milestones: true
