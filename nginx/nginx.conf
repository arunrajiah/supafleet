events {
    worker_connections 2048;
}

http {
    # Docker's internal DNS resolver — required for dynamic upstream names
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Don't advertise nginx version in Server header or error pages.
    server_tokens off;

    # WebSocket support
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    proxy_read_timeout    300s;
    proxy_connect_timeout  75s;
    proxy_send_timeout    300s;
    client_max_body_size   50m;

    # ── Security headers (applied to every server block) ──────────────────────
    #
    # add_header directives defined here at http-level are inherited by server
    # and location blocks that do not define their own add_header (nginx rule).
    # We repeat them explicitly inside each server block so the behaviour is
    # predictable even if someone adds a location-level add_header later.

    # ── Admin UI ──────────────────────────────────────────────────────────────
    server {
        listen 80 default_server;

        # Security headers
        add_header X-Content-Type-Options   "nosniff"                     always;
        add_header X-Frame-Options          "SAMEORIGIN"                  always;
        add_header X-XSS-Protection         "1; mode=block"               always;
        add_header Referrer-Policy          "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy       "camera=(), microphone=(), geolocation=()" always;
        # CSP: Next.js needs 'unsafe-inline' for its server-rendered style and
        # script tags; tighten further once a nonce strategy is adopted.
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; font-src 'self'; frame-ancestors 'none';" always;

        location / {
            set $up_admin http://supabase-admin:3000;
            proxy_pass $up_admin;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }
    }

    # ── Tenant virtual hosts (generated by the admin UI) ──────────────────────
    include /etc/nginx/conf.d/*.conf;
}
